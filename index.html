<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Type Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@400;600&family=Roboto+Mono:wght@400;600&family=JetBrains+Mono:wght@400;600&family=Fira+Code:wght@400;600&family=Source+Code+Pro:wght@400;600&family=Space+Mono&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <a id="logo" class="logo" href="./">type<span>race</span></a>
    <div>
      <span id="roomInfo" class="hidden">
        <span class="muted">room</span> <b id="roomCode"></b>
        <button id="copyBtn" class="icon-btn">copy invite link</button>
      </span>
      <button id="gearBtn" class="icon-btn" aria-label="settings">⚙ settings</button>
      <button id="leaveBtn" class="icon-btn hidden">← menu</button>
    </div>
  </header>

  <section id="home">
    <div id="backRow" class="row hidden">
      <button id="backBtn" class="primary" style="flex:1">back to room</button>
      <button id="leaveRoomBtn">leave room</button>
    </div>
    <label for="name">your name</label>
    <input id="name" maxlength="16" placeholder="name" autocomplete="off">
    <button id="soloBtn" class="primary">solo</button>
    <label>multiplayer</label>
    <button id="createBtn">create room</button>
    <label for="code">or join a friend's room</label>
    <div class="row">
      <input id="code" maxlength="4" placeholder="CODE" autocomplete="off" style="text-transform:uppercase">
      <button id="joinBtn">join</button>
    </div>
    <div id="homeErr"></div>
  </section>

  <section id="room" class="hidden" style="display:flex;flex-direction:column;flex:1">
    <div id="cfgBar"></div>
    <div id="cfgNote"></div>
    <div id="players"></div>
    <div id="stage">
      <div id="status"></div>
      <div id="mini"><span id="miniTimer"></span><span id="miniWpm"></span></div>
      <div id="box" tabindex="0"><div id="words"></div><div class="hint">click here or press any key to focus</div></div>
      <div id="keymap"></div>
      <div id="results" class="hidden"></div>
      <div id="controls">
        <button id="startBtn" class="primary hidden">start race</button>
        <button id="endBtn" class="hidden">end race</button>
      </div>
    </div>
    <footer id="footer"></footer>
  </section>
</div>

<div id="settings" class="hidden">
  <div class="panel">
    <h2>settings <button id="closeSettings" class="icon-btn" aria-label="close">✕ close</button></h2>
    <div id="settingsBody"></div>
  </div>
</div>

<script src="game.js"></script>
</body>
</html>
